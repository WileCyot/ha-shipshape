complete_chore:
  fields:
    chore_id:
      selector:
        text:
    chore:
      example: Wipe counters
      selector:
        text:
    zone:
      example: Kitchen
      selector:
        text:
    by:
      selector:
        entity:
          domain: person

snooze_chore:
  fields:
    chore_id:
      selector:
        text:
    chore:
      selector:
        text:
    zone:
      selector:
        text:
    days:
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box

make_due:
  fields:
    chore_id:
      selector:
        text:
    chore:
      selector:
        text:
    zone:
      selector:
        text:

add_chore:
  fields:
    zone:
      required: true
      example: Kitchen
      selector:
        text:
    name:
      required: true
      example: Wipe counters
      selector:
        text:
    every:
      example: 2
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    unit:
      selector:
        select:
          options:
            - days
            - weeks
            - months
    months:
      example: "[4, 10]"
      selector:
        object:
    effort:
      selector:
        number:
          min: 1
          max: 3
    assignees:
      selector:
        entity:
          domain: person
          multiple: true
    rotate:
      selector:
        boolean:

import_data:
  fields:
    data:
      required: true
      selector:
        object:
    replace:
      default: false
      selector:
        boolean:
    stagger:
      default: true
      selector:
        boolean:

export_data:

set_vacation:
  fields:
    active:
      required: true
      selector:
        boolean:

sync_now:

send_reminders:
  fields:
    kind:
      required: true
      selector:
        select:
          options:
            - digest
            - push
            - announce

skylight_status:

skylight_api:
  fields:
    path:
      required: true
      example: "/frames/{frame}/categories"
      selector:
        text:
    method:
      default: GET
      selector:
        select:
          options:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
    params:
      selector:
        object:
    body:
      selector:
        object:
